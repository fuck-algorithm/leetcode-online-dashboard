# Redis 配置文件 - 只允许本地连接（容器内网络）

# 绑定地址 - 监听所有接口（Docker容器内）
bind 0.0.0.0

# 端口
port 6379

# 保护模式 - 开启
protected-mode yes

# 持久化配置
appendonly yes
appendfsync everysec

# 内存限制（可选，根据需要调整）
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# 日志级别
loglevel notice

# 数据库数量
databases 16

# 禁用危险命令（生产环境建议）
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""
