version: '3.8'

# ============================================
# LeetCode Dashboard - Docker Compose (Physical MySQL/Redis)
# 使用标准端口 80/8080 避免云服务商限制
# ============================================

x-common-variables: &common-variables
  TZ: Asia/Shanghai
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-backend-env: &backend-env
  <<: *common-variables
  PORT: 8080
  DB_HOST: host.docker.internal
  DB_PORT: 3306
  DB_USER: leetcode
  DB_PASSWORD: leetcode123
  DB_NAME: leetcode_dashboard
  REDIS_HOST: host.docker.internal
  REDIS_PORT: 6379
  REDIS_PASSWORD: leetcode123
  REDIS_DB: 0
  BATCH_SIZE: ${BATCH_SIZE:-10}
  INTERVAL_SEC: ${INTERVAL_SEC:-30}
  GIN_MODE: release

services:
  # ============================================
  # Backend API - 后端API服务 (端口 8080)
  # ============================================
  backend:
    image: leetcode-dashboard-backend:latest
    container_name: leetcode-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *backend-env
    volumes:
      - ${DATA_DIR:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # Crawler - 数据爬取服务
  # ============================================
  crawler:
    image: leetcode-dashboard-crawler:latest
    container_name: leetcode-crawler
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ${DATA_DIR:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "pgrep", "leetcode-crawler"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # Frontend - 前端Nginx服务 (端口 80)
  # ============================================
  frontend:
    image: leetcode-dashboard-frontend:latest
    container_name: leetcode-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  dashboard-network:
    driver: bridge
