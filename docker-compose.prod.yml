version: '3.8'

# ============================================
# LeetCode Dashboard - Production Compose
# ============================================
# 新架构特性：
# - 镜像版本可控（通过环境变量）
# - 健康检查和自动重启
# - 资源限制配置
# - 日志轮转
# ============================================

x-common-variables: &common-variables
  TZ: Asia/Shanghai
  LOG_LEVEL: ${LOG_LEVEL:-info}
  
x-backend-env: &backend-env
  <<: *common-variables
  PORT: 8080
  # K8s PostgreSQL（database namespace）：集群外走 local-server-001 NodePort，
  # 集群内可改为 postgres.database.svc.cluster.local:5432
  DB_HOST: ${DB_HOST:-local-server-001}
  DB_PORT: ${DB_PORT:-30432}
  DB_USER: ${DB_USER:-leetcode_dashboard}
  DB_PASSWORD: ${DB_PASSWORD:-change-me}
  DB_NAME: ${DB_NAME:-leetcode_dashboard}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Shanghai}
  # K8s Redis（database namespace）：集群外 local-server-001:30379
  REDIS_HOST: ${REDIS_HOST:-local-server-001}
  REDIS_PORT: ${REDIS_PORT:-30379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-leetcode-dashboard}
  BATCH_SIZE: ${BATCH_SIZE:-10}
  INTERVAL_SEC: ${INTERVAL_SEC:-30}
  GIN_MODE: release

services:
  # ============================================
  # Backend API - 后端API服务
  # ============================================
  backend:
    image: ${BACKEND_IMAGE:-leetcode-dashboard-backend:latest}
    container_name: leetcode-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-52106}:8080"
    environment:
      <<: *backend-env
    volumes:
      - ${DATA_DIR:-./data}:/data
    extra_hosts:
      - "${DB_HOST:-local-server-001}:host-gateway"
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # Crawler - 数据爬取服务
  # ============================================
  crawler:
    image: ${CRAWLER_IMAGE:-leetcode-dashboard-crawler:latest}
    container_name: leetcode-crawler
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ${DATA_DIR:-./data}:/data
    extra_hosts:
      - "${DB_HOST:-local-server-001}:host-gateway"
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "pgrep", "leetcode-crawler"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # Frontend - 前端Nginx服务
  # ============================================
  frontend:
    image: ${FRONTEND_IMAGE:-leetcode-dashboard-frontend:latest}
    container_name: leetcode-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-52107}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  dashboard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
