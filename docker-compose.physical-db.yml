version: '3.8'

# ============================================
# LeetCode Dashboard - Docker Compose (Physical K8s PostgreSQL/Redis)
# ============================================
# 此配置用于连接物理机（K8s NodePort）上的 PostgreSQL 和 Redis
# 后端、爬虫、前端使用 Docker 部署
# ============================================

x-common-variables: &common-variables
  TZ: Asia/Shanghai
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-backend-env: &backend-env
  <<: *common-variables
  PORT: 8080
  DB_HOST: 127.0.0.1
  DB_PORT: 30432
  DB_USER: leetcode_dashboard
  DB_PASSWORD: change-me
  DB_SSLMODE: disable
  DB_TIMEZONE: Asia/Shanghai
  DB_NAME: leetcode_dashboard
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 30379
  REDIS_PASSWORD: 
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-leetcode-dashboard}
  BATCH_SIZE: ${BATCH_SIZE:-10}
  INTERVAL_SEC: ${INTERVAL_SEC:-30}
  GIN_MODE: release

services:
  # ============================================
  # Backend API - 后端API服务
  # ============================================
  backend:
    image: leetcode-dashboard-backend:latest
    container_name: leetcode-backend
    restart: unless-stopped
    ports:
      - "52106:8080"
    environment:
      <<: *backend-env
    volumes:
      - ${DATA_DIR:-./data}:/data
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # Crawler - 数据爬取服务
  # ============================================
  crawler:
    image: leetcode-dashboard-crawler:latest
    container_name: leetcode-crawler
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ${DATA_DIR:-./data}:/data
    network_mode: host
    healthcheck:
      test: ["CMD", "pgrep", "leetcode-crawler"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # Frontend - 前端Nginx服务
  # ============================================
  frontend:
    image: leetcode-dashboard-frontend:latest
    container_name: leetcode-frontend
    restart: unless-stopped
    ports:
      - "52107:80"
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
