version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leetcode-dashboard-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST:-local-server-001}
      - DB_PORT=${DB_PORT:-30432}
      - DB_USER=${DB_USER:-leetcode_dashboard}
      - DB_PASSWORD=${DB_PASSWORD:-change-me}
      - DB_NAME=${DB_NAME:-leetcode_dashboard}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_TIMEZONE=${DB_TIMEZONE:-Asia/Shanghai}
      - REDIS_HOST=${REDIS_HOST:-local-server-001}
      - REDIS_PORT=${REDIS_PORT:-30379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-leetcode-dashboard}
      - BATCH_SIZE=10
      - INTERVAL_SEC=30
      - GIN_MODE=release
    volumes:
      - ./data:/data
    extra_hosts:
      - "${DB_HOST:-local-server-001}:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - dashboard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leetcode-dashboard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - dashboard-network

  # 可选：Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: leetcode-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - dashboard-network
    profiles:
      - with-redis

volumes:
  redis-data:

networks:
  dashboard-network:
    driver: bridge
